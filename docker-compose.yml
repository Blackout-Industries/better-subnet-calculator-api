services:
  app:
    build:
      context: .
      target: runtime
    image: subnet-api:latest
    container_name: subnet-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    container_name: subnet-api-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - subnet-api-venv:/app/.venv
    working_dir: /app
    command: ["uvicorn", "subnet_api.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "src"]

  test:
    profiles: ["test"]
    build:
      context: .
      target: deps
    container_name: subnet-api-test
    volumes:
      - .:/app
      - subnet-api-venv:/app/.venv
    working_dir: /app
    command: ["uv", "run", "pytest"]

volumes:
  subnet-api-venv:
