[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subnet-api"
version = "0.0.0"
description = "better-subnet-calculator-api: stateless HTTP service for IPv4 subnet math"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Blackout Industries" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/Blackout-Industries/better-subnet-calculator-api"
Issues = "https://github.com/Blackout-Industries/better-subnet-calculator-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/subnet_api"]

[tool.hatch.build.targets.sdist]
include = ["src/subnet_api", "README.md", "BRD.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_decorators = false
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=subnet_api",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["subnet_api"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
